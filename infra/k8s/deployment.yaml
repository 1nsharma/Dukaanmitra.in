apiVersion: apps/v1
kind: Deployment
metadata:
  name: dukaanmitra-core-engine
  namespace: production
  labels:
    app: dukaanmitra-core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dukaanmitra-core
  template:
    metadata:
      labels:
        app: dukaanmitra-core
    spec:
      containers:
      - name: core-engine
        image: gcr.io/dukaanmitra-in/core-engine:v1.0.0
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: OPENWA_URL
          value: "http://openwa-service:2785"
        - name: AI_SERVICES_URL
          value: "http://ai-services:8000"
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dukaanmitra-ai-services
  namespace: production
  labels:
    app: dukaanmitra-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dukaanmitra-ai
  template:
    metadata:
      labels:
        app: dukaanmitra-ai
    spec:
      containers:
      - name: ai-services
        image: gcr.io/dukaanmitra-in/ai-services:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: DUKAANMITRA_ENV
          value: "production"
        resources:
          limits:
            cpu: "2000m"
            memory: "2048Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
