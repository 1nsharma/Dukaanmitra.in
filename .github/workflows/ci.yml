name: DukaanMitra CI

on:
  push:
    branches: [feat/shared-ai-brain-foundation]
  pull_request:
    branches: [feat/shared-ai-brain-foundation]

permissions:
  contents: read

concurrency:
  group: dukaanmitra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
