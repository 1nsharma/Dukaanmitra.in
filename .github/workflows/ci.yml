name: DukaanMitra CI

on:
  push:
    branches: [feat/shared-ai-brain-foundation, fix/ci-lockfile-reconciliation, cleanup/remove-tracked-dependencies-and-env, integration/unified-dukaanmitra-core]
  pull_request:
    branches: [Anti]

permissions:
  contents: read

concurrency:
  group: dukaanmitra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Temporary reconciliation: the current root lockfile fails npm ci with
      # EUSAGE and missing package entries. Regenerate it in a reviewed follow-up.
      - name: Install root dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install consolidated retail-core dependencies
        run: npm ci --prefix packages/retail-core --no-audit --no-fund
      - name: Retail-core tests
        run: npm --prefix packages/retail-core test
      - name: Retail-core build
        run: npm --prefix packages/retail-core run build
