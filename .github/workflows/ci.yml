name: DukaanMitra CI

on:
  push:
    branches: [feat/shared-ai-brain-foundation, fix/ci-lockfile-reconciliation, cleanup/remove-tracked-dependencies-and-env]
  pull_request:
    branches: [Anti]

permissions:
  contents: read

concurrency:
  group: dukaanmitra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Temporary reconciliation: the current lockfile fails npm ci with
      # EUSAGE and missing package entries. Regenerate the lockfile in a
      # reviewed follow-up before restoring deterministic npm ci installs.
      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
